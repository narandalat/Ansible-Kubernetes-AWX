name: Ansible CI

on:
  push:
    branches: [ main, naranda-local ]
  pull_request:
    branches: [ main ]

jobs:

  lint-ansible:
    name: Validar playbooks con ansible-lint
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar ansible-lint
        run: pip install ansible ansible-lint

      - name: Ejecutar ansible-lint
        run: ansible-lint playbooks/ || true

  lint-yaml:
    name: Validar archivos YAML
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar yamllint
        run: pip install yamllint

      - name: Ejecutar yamllint
        run: yamllint -d relaxed playbooks/ inventories/ || true

  summary:
    name: Resumen del pipeline
    runs-on: ubuntu-latest
    needs: [lint-ansible, lint-yaml]
    steps:
      - name: Mostrar resultado
        run: |
          echo "Pipeline completado"
          echo "Rama: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Autor: ${{ github.actor }}"